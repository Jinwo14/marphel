<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARPHEL | Stealth Ops</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Cyber Grid Background -->
  <div class="cyber-grid"></div>

  <div class="app-container">
    <header>
      <h1 class="glitch-title">MARPHEL</h1>
      <p class="subtitle">EPHEMERAL // ZERO-TRACE COMMUNICATIONS</p>
    </header>

    <!-- Join Screen -->
    <div id="join-screen" class="card glow-border">
      <div class="status-indicator"><span class="pulse-dot"></span> SECURE TERMINAL</div>
      <input type="text" id="room-input" placeholder="ENTER FREQUENCY / ROOM CODE" />
      <button id="join-btn" class="primary-btn">INITIALIZE LINK</button>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen" class="card glow-border hidden">
      <div class="chat-header">
        <div class="channel-info">
          <span class="pulse-dot"></span> FREQ: <strong id="current-room">---</strong>
        </div>
        <div class="header-buttons">
          <button id="copy-link-btn" class="action-btn">🔗 SHARE FREQ</button>
          <button id="boom-btn" class="danger-btn">💣 PURGE ALL</button>
        </div>
      </div>

      <div id="message-box" class="message-box"></div>

      <div class="chat-input-area">
        <input type="file" id="image-input" accept="image/*" style="display: none;" />
        <button id="img-btn" class="action-btn icon-btn" title="Send Classified Image">📷</button>
        <input type="text" id="message-input" placeholder="Transmit message..." />
        <button id="send-btn" class="primary-btn">SEND</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
